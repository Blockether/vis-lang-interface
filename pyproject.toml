[project]
name = "vis-lang-interface"
version = "1.0.1"
description = "The shared contract for Vis language extensions, with exact JSON and TOML checks."
requires-python = ">=3.11"
dependencies = ["vis-agent>=0.2.10"]

[tool.vis]
category = "tools"
source_paths = ["src"]

[tool.ruff]
# The README aligns its examples for people to read; ruff must not reflow them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pinned so a new ruff default set cannot change the verdict of a release.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# TestResult and TestFailure are contract types, not test cases: collect functions only.
python_classes = []
