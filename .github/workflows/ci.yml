name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the declared dependencies
        run: uv sync
      - name: Check that both version declarations agree
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          registered=$(python3 -c "import re,pathlib;print(re.search(r'version=\"([^\"]+)\"', pathlib.Path('extension.py').read_text()).group(1))")
          if [ "$declared" != "$registered" ]; then
            echo "pyproject version $declared and extension version $registered disagree." >&2
            exit 1
          fi
      - name: Check formatting
        run: uv run --with ruff ruff format --check .
      - name: Lint
        run: uv run --with ruff ruff check .
      - name: Run the tests
        run: uv run --with pytest pytest tests -q
